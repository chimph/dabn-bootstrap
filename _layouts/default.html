<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080c11">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="Encrypted fragments. Witnessed custody. Local trust.">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="Encrypted fragments. Witnessed custody. Local trust.">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/og.png">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/style.css?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <a class="brand" href="{{ site.baseurl }}/" aria-label="DABN home">
        <span class="brand-mark" aria-hidden="true"></span>
        DABN
      </a>
      <span class="header-status"><span class="status-dot"></span> invited beta</span>
    </header>

    <nav class="section-nav" aria-label="Page sections">
      {%- for section in site.data.sections %}
      <a href="#{{ section.id }}">{{ section.label }}</a>
      {%- endfor %}
    </nav>

    <main class="document-grid">
      <nav class="rail" aria-label="Document index">
        <p>README</p>
        {%- for section in site.data.sections %}
        <a href="#{{ section.id }}"><span>{{ forloop.index | prepend: '0' | slice: -2, 2 }}</span>{{ section.label }}</a>
        {%- endfor %}
      </nav>
      <article class="readme" id="content">
        {{ content }}
      </article>
    </main>

    <footer>
      <span>DABN</span>
      <span>MIT OR Apache-2.0</span>
    </footer>

    <script>
      // Highlights the section index entry for whatever heading you are reading.
      // Progressive enhancement: without it the index still navigates normally.
      (function () {
        var links = document.querySelectorAll('.rail a, .section-nav a');
        if (!links.length) return;

        var groups = [];
        var byId = {};
        Array.prototype.forEach.call(links, function (link) {
          var id = decodeURIComponent(link.hash.slice(1));
          var heading = document.getElementById(id);
          if (!heading) return;
          if (!byId[id]) {
            byId[id] = { heading: heading, links: [] };
            groups.push(byId[id]);
          }
          byId[id].links.push(link);
        });
        if (!groups.length) return;

        var active = null;
        function update() {
          ticking = false;
          var line = window.innerHeight * 0.2;
          var current = groups[0];
          for (var i = 0; i < groups.length; i++) {
            if (groups[i].heading.getBoundingClientRect().top > line) break;
            current = groups[i];
          }
          // A short final section never reaches the line, so claim it once the
          // page is scrolled to the bottom.
          var atBottom =
            window.scrollY + window.innerHeight >=
            document.documentElement.scrollHeight - 2;
          if (atBottom) current = groups[groups.length - 1];
          if (current === active) return;
          if (active) active.links.forEach(function (l) { l.removeAttribute('aria-current'); });
          current.links.forEach(function (l) { l.setAttribute('aria-current', 'true'); });
          active = current;
        }

        var ticking = false;
        function schedule() {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(update);
        }

        update();
        window.addEventListener('scroll', schedule, { passive: true });
        window.addEventListener('resize', schedule, { passive: true });
      })();
    </script>
  </body>
</html>
