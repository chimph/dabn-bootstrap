<svg width="680" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How a DABN node stores data</title>
<desc>Source folders are snapshotted into an encrypted vault inside node storage, which also holds the identity key and fragments guarded for others. The vault is erasure-coded to guardians on the network, and the recovery phrase alone can rebuild it on a fresh machine.</desc>
<defs>
  <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b7ad9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .t  { font: 500 14px -apple-system, "Segoe UI", sans-serif; }
  .s  { font: 400 12px -apple-system, "Segoe UI", sans-serif; }
</style>

<rect x="0" y="0" width="680" height="620" rx="8" fill="#0e1116"/>

<!-- source folders -->
<rect x="40" y="40" width="180" height="52" rx="4" fill="#11161d" stroke="#262c36" stroke-width="1"/>
<text class="t" x="130" y="62" text-anchor="middle" fill="#c9d1d9">Source folders</text>
<text class="s" x="130" y="80" text-anchor="middle" fill="#8b949e">plaintext · vault outlives them</text>
<line x1="130" y1="92" x2="130" y2="146" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<text class="s" x="142" y="124" fill="#8b949e">snapshot: chunk + encrypt</text>

<!-- node storage container -->
<rect x="40" y="150" width="600" height="122" rx="6" fill="none" stroke="#3a4250" stroke-width="1" stroke-dasharray="5 4"/>
<text class="s" x="52" y="170" fill="#adbac7">Node storage: the directory that is the node</text>
<rect x="56" y="188" width="160" height="64" rx="4" fill="#11161d" stroke="#262c36" stroke-width="1"/>
<text class="t" x="136" y="214" text-anchor="middle" fill="#c9d1d9">Identity &amp; config</text>
<text class="s" x="136" y="232" text-anchor="middle" fill="#8b949e">keys &amp; settings</text>
<rect x="228" y="188" width="196" height="64" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="326" y="214" text-anchor="middle" fill="#3fb950">My vault</text>
<text class="s" x="326" y="232" text-anchor="middle" fill="#7fa88a">encrypted chunks + manifest</text>
<rect x="440" y="188" width="184" height="64" rx="4" fill="#171227" stroke="#3a2f56" stroke-width="1"/>
<text class="t" x="532" y="214" text-anchor="middle" fill="#b39df3">Guarded fragments</text>
<text class="s" x="532" y="232" text-anchor="middle" fill="#8b7ad9">others' data (pledge)</text>

<!-- vault fragments to guardians -->
<line x1="280" y1="252" x2="146" y2="340" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mg)"/>
<line x1="326" y1="252" x2="330" y2="340" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mg)"/>
<line x1="372" y1="252" x2="514" y2="340" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mg)"/>
<!-- other members place data on you -->
<line x1="585" y1="308" x2="545" y2="256" stroke="#8b7ad9" stroke-width="1.5" marker-end="url(#mv)"/>

<!-- network container -->
<rect x="40" y="312" width="600" height="148" rx="6" fill="none" stroke="#3a4250" stroke-width="1" stroke-dasharray="5 4"/>
<text class="s" x="52" y="332" fill="#adbac7">The network · guardians: any 3 of 5 fragments rebuild a chunk</text>
<rect x="64" y="346" width="160" height="96" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="144" y="388" text-anchor="middle" fill="#3fb950">Guardian A</text>
<text class="s" x="144" y="406" text-anchor="middle" fill="#7fa88a">fragments · manifest</text>
<rect x="250" y="346" width="160" height="96" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="330" y="388" text-anchor="middle" fill="#3fb950">Guardian B</text>
<text class="s" x="330" y="406" text-anchor="middle" fill="#7fa88a">fragments · manifest</text>
<rect x="436" y="346" width="160" height="96" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="516" y="388" text-anchor="middle" fill="#3fb950">Guardian C</text>
<text class="s" x="516" y="406" text-anchor="middle" fill="#7fa88a">ciphertext only</text>

<!-- recovery flow -->
<line x1="340" y1="460" x2="340" y2="496" stroke="#3fb950" stroke-width="1.5" marker-end="url(#mg)"/>
<rect x="40" y="500" width="200" height="52" rx="4" fill="#1c1808" stroke="#3d3218" stroke-width="1"/>
<text class="t" x="140" y="522" text-anchor="middle" fill="#d29922">Recovery phrase</text>
<text class="s" x="140" y="540" text-anchor="middle" fill="#a8842e">the only key · off-node</text>
<line x1="240" y1="526" x2="260" y2="526" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<rect x="264" y="500" width="152" height="52" rx="4" fill="#11161d" stroke="#262c36" stroke-width="1"/>
<text class="t" x="340" y="522" text-anchor="middle" fill="#c9d1d9">Find guardians</text>
<text class="s" x="340" y="540" text-anchor="middle" fill="#8b949e">keys + vault id</text>
<line x1="416" y1="526" x2="436" y2="526" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<rect x="440" y="500" width="200" height="52" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="540" y="522" text-anchor="middle" fill="#3fb950">Fresh machine</text>
<text class="s" x="540" y="540" text-anchor="middle" fill="#7fa88a">rebuilt byte-for-byte</text>

<!-- legend -->
<rect x="40" y="576" width="12" height="12" rx="2" fill="#132018" stroke="#3fb950" stroke-width="1"/>
<text class="s" x="60" y="586" fill="#8b949e">your encrypted data</text>
<rect x="200" y="576" width="12" height="12" rx="2" fill="#171227" stroke="#8b7ad9" stroke-width="1"/>
<text class="s" x="220" y="586" fill="#8b949e">other members' data</text>
</svg>
