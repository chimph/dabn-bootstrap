<svg width="680" viewBox="0 0 680 644" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How DABN stores a file</title>
<desc>A file is split into content-defined chunks, deduplicated, each new chunk is compressed and encrypted, recorded in a manifest inside the vault, then erasure-coded into five fragments with blinded addresses and placed on guardians.</desc>
<defs>
  <marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .t { font: 500 14px -apple-system, "Segoe UI", sans-serif; }
  .s { font: 400 12px -apple-system, "Segoe UI", sans-serif; }
</style>

<rect x="0" y="0" width="680" height="644" rx="8" fill="#0e1116"/>

<!-- source file -->
<rect x="250" y="40" width="180" height="52" rx="4" fill="#11161d" stroke="#262c36" stroke-width="1"/>
<text class="t" x="340" y="62" text-anchor="middle" fill="#c9d1d9">report.pdf</text>
<text class="s" x="340" y="80" text-anchor="middle" fill="#8b949e">one source file · plaintext</text>

<!-- chunking fan -->
<line x1="340" y1="92" x2="162" y2="136" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<line x1="340" y1="92" x2="340" y2="136" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<line x1="340" y1="92" x2="518" y2="136" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<text class="s" x="40" y="120" fill="#8b949e">content-defined chunking</text>

<!-- chunks -->
<rect x="80" y="140" width="160" height="52" rx="4" fill="#11161d" stroke="#262c36" stroke-width="1"/>
<text class="t" x="160" y="162" text-anchor="middle" fill="#c9d1d9">Chunk A · ~64 KB</text>
<text class="s" x="160" y="180" text-anchor="middle" fill="#8b949e">id = hash(bytes)</text>
<rect x="260" y="140" width="160" height="52" rx="4" fill="#11161d" stroke="#262c36" stroke-width="1"/>
<text class="t" x="340" y="162" text-anchor="middle" fill="#c9d1d9">Chunk B</text>
<text class="s" x="340" y="180" text-anchor="middle" fill="#8b949e">id = hash(bytes)</text>
<rect x="440" y="140" width="160" height="52" rx="4" fill="#11161d" stroke="#262c36" stroke-width="1"/>
<text class="t" x="520" y="162" text-anchor="middle" fill="#c9d1d9">Chunk C</text>
<text class="s" x="520" y="180" text-anchor="middle" fill="#8b949e">already stored → skip</text>

<!-- seal arrows -->
<line x1="160" y1="192" x2="140" y2="260" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<line x1="340" y1="192" x2="306" y2="260" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<text class="s" x="400" y="222" fill="#8b949e">compress + seal new chunks</text>
<text class="s" x="400" y="238" fill="#8b949e">(zstd, then XChaCha20-Poly1305)</text>

<!-- vault container -->
<rect x="40" y="264" width="600" height="112" rx="6" fill="none" stroke="#3a4250" stroke-width="1" stroke-dasharray="5 4"/>
<text class="s" x="52" y="284" fill="#adbac7">My vault: sealed chunks + manifest, content-addressed, stored once</text>
<rect x="64" y="296" width="150" height="64" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="139" y="322" text-anchor="middle" fill="#3fb950">Sealed A</text>
<text class="s" x="139" y="340" text-anchor="middle" fill="#7fa88a">nonce ‖ ciphertext</text>
<rect x="230" y="296" width="150" height="64" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="305" y="322" text-anchor="middle" fill="#3fb950">Sealed B</text>
<text class="s" x="305" y="340" text-anchor="middle" fill="#7fa88a">nonce ‖ ciphertext</text>
<rect x="396" y="296" width="228" height="64" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="510" y="322" text-anchor="middle" fill="#3fb950">Manifest</text>
<text class="s" x="510" y="340" text-anchor="middle" fill="#7fa88a">report.pdf → A, B, C</text>

<!-- erasure coding -->
<line x1="139" y1="376" x2="139" y2="416" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<text class="s" x="151" y="400" fill="#8b949e">erasure-code: 3-of-5</text>

<!-- fragments container -->
<rect x="40" y="420" width="600" height="104" rx="6" fill="none" stroke="#3a4250" stroke-width="1" stroke-dasharray="5 4"/>
<text class="s" x="52" y="440" fill="#adbac7">fragments of chunk A: any 3 rebuild it · addresses blinded by your key</text>
<rect x="52" y="452" width="104" height="52" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="104" y="474" text-anchor="middle" fill="#3fb950">frag 0</text>
<text class="s" x="104" y="492" text-anchor="middle" fill="#7fa88a">data · ⅓ size</text>
<rect x="170" y="452" width="104" height="52" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="222" y="474" text-anchor="middle" fill="#3fb950">frag 1</text>
<text class="s" x="222" y="492" text-anchor="middle" fill="#7fa88a">data</text>
<rect x="288" y="452" width="104" height="52" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="340" y="474" text-anchor="middle" fill="#3fb950">frag 2</text>
<text class="s" x="340" y="492" text-anchor="middle" fill="#7fa88a">data</text>
<rect x="406" y="452" width="104" height="52" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="458" y="474" text-anchor="middle" fill="#3fb950">frag 3</text>
<text class="s" x="458" y="492" text-anchor="middle" fill="#7fa88a">parity</text>
<rect x="524" y="452" width="104" height="52" rx="4" fill="#132018" stroke="#2a4030" stroke-width="1"/>
<text class="t" x="576" y="474" text-anchor="middle" fill="#3fb950">frag 4</text>
<text class="s" x="576" y="492" text-anchor="middle" fill="#7fa88a">parity</text>

<!-- to guardians -->
<line x1="340" y1="524" x2="340" y2="556" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mn)"/>
<rect x="200" y="560" width="280" height="52" rx="4" fill="#11161d" stroke="#262c36" stroke-width="1"/>
<text class="t" x="340" y="582" text-anchor="middle" fill="#c9d1d9">5 guardians</text>
<text class="s" x="340" y="600" text-anchor="middle" fill="#8b949e">one fragment each · sealed manifest</text>

<!-- legend -->
<rect x="40" y="624" width="12" height="12" rx="2" fill="#11161d" stroke="#8b949e" stroke-width="1"/>
<text class="s" x="60" y="634" fill="#8b949e">plaintext (never leaves)</text>
<rect x="230" y="624" width="12" height="12" rx="2" fill="#132018" stroke="#3fb950" stroke-width="1"/>
<text class="s" x="250" y="634" fill="#8b949e">encrypted under your key</text>
</svg>
